[package]
name = "pod-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pod_vault"

[features]
default = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
idl-build = [
  "anchor-lang/idl-build",
  "anchor-spl/idl-build",
  "pod-rwa-common/idl-build",
  "pod-compliance/idl-build",
  "pod-oracle/idl-build",
]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
pod-rwa-common = { path = "../../crates/pod-rwa-common" }
pod-compliance = { path = "../pod-compliance", features = ["cpi"] }
pod-oracle = { path = "../pod-oracle", features = ["cpi"] }
