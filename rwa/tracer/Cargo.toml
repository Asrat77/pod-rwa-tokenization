[package]
name = "pod-rwa-tracer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Integration harness only — never deployed. Runs the three programs natively through
# solana-program-test's BanksClient, so the end-to-end lifecycle can be exercised without
# the SBF platform-tools toolchain.

[dependencies]
pod-rwa-common = { path = "../crates/pod-rwa-common" }
pod-oracle = { path = "../programs/pod-oracle", features = ["no-entrypoint"] }
pod-compliance = { path = "../programs/pod-compliance", features = ["no-entrypoint"] }
pod-vault = { path = "../programs/pod-vault", features = ["no-entrypoint"] }
anchor-lang.workspace = true
anchor-spl.workspace = true

[dev-dependencies]
# anchor-lang 1.1.2 is built on the solana 3.x modular crates (solana-pubkey 3.0.0,
# solana-instruction 3.0.0, solana-account-info 3.1.0) — NOT the 2.x generation implied by the
# legacy solana-program 2.3.0 shim in the lockfile. solana-program-test 3.1.10 is the release
# that targets the same generation (and matches the installed agave 3.1.10 CLI). Pairing it
# with 2.x instead makes Pubkey and AccountInfo different types, so `processor!` cannot
# typecheck against the programs' `entry`.
solana-program-test = "=3.1.10"
solana-pubkey = "3.0.0"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-instruction = "3.0.0"
solana-transaction = "3.0.2"
solana-system-interface = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
