[workspace]
members = [
  "crates/pod-rwa-common",
  "programs/pod-oracle",
  "programs/pod-compliance",
  "programs/pod-vault",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2" }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
